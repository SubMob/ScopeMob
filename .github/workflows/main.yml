name: ScopeMob CI

on:
  pull_request:
  push:
    branches:
      - develop
  schedule:
    - cron: '0 3 1 * *' # 03:00 UTC on the first of the month

jobs:
  ci:

    runs-on: macos-26

    permissions:
      contents: write # create the release tag

    steps:
      - name: Setup Gradle Repo
        uses: Oztechan/Global/actions/setup-gradle-repo@3b97f22e81f7d532557bbc8f70621fcea33b2645 # v1.0.168

      - name: Gradle Build
        run: ./gradlew build koverXmlReport --parallel

      - name: Upload to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/reports/kover/report.xml

      - name: Upload to Codacy
        continue-on-error: true
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: build/reports/kover/report.xml

      # The version is the commit count, so a month without merges would republish a version that
      # already exists and Maven Central refuses that. Skip instead of failing the scheduled run.
      - name: Check the version is unpublished
        id: unpublished
        if: github.event_name == 'schedule'
        run: |
          version=$(./gradlew -q printVersion | grep '^VERSION_NAME=' | cut -d= -f2)
          url="https://repo1.maven.org/maven2/com/github/submob/$ARTIFACT/$version/$ARTIFACT-$version.pom"
          if [ "$(curl -s -o /dev/null -w '%{http_code}' "$url")" = "200" ]; then
            echo "$version is already on Maven Central, nothing to publish."
            echo "publish=false" >> $GITHUB_OUTPUT
          else
            echo "publish=true" >> $GITHUB_OUTPUT
          fi
        env:
          ARTIFACT: scopemob

      # Monthly, so a run of dependency bumps costs one Maven Central release instead of a dozen.
      # Consumers that need every commit read the tags below. Every other branch builds
      # X.Y-SNAPSHOT and never publishes.
      - name: Publish
        if: github.event_name == 'schedule' && steps.unpublished.outputs.publish == 'true'
        # Normalize the armored GPG key: literal "\n" -> real newlines (vanniktech's
        # signingInMemoryKey needs real newlines); a correct key passes through unchanged.
        run: |
          export ORG_GRADLE_PROJECT_signingInMemoryKey="$(printf '%b' "$GPG_KEY_RAW")"
          ./gradlew publishToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
          GPG_KEY_RAW: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSWORD }}

      # Read back from Gradle so the tag always matches the version the build produced.
      - name: Resolve version
        id: version
        if: github.event_name == 'push'
        run: echo "version=$(./gradlew -q printVersion | grep '^VERSION_NAME=' | cut -d= -f2)" >> $GITHUB_OUTPUT

      # Tags every merge and cuts the matching GitHub release. The consumers pin submodules to these
      # tags, so they have to exist per commit even though Maven Central only gets a monthly release.
      # Done inline rather than from a tag-triggered workflow, because tags pushed with GITHUB_TOKEN
      # never trigger other workflows. --generate-notes fills the body from the merged PRs.
      - name: PublishRelease
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ steps.version.outputs.version }}" --target "$GITHUB_SHA" --generate-notes

      - name: Notify slack fail
        if: failure()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        uses: voxmedia/github-action-slack-notify-build@373da97827332b19e753c84d1e5b7937dbe0fbfa # v2
        with:
          channel: submob
          status: FAILED
          color: danger
