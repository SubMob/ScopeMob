# Gradle
org.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2G -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.kotlin.dsl.allWarningsAsErrors=true
org.gradle.configuration-cache=true
# Kotlin
kotlin.code.style=official
kotlin.build.report.output=build_scan,file
kotlin.incremental=true
kotlin.incremental.native=true
# KMP
kotlin.incremental.multiplatform=true
# Maven Central publishing (Central Portal) via com.vanniktech.maven.publish
GROUP=com.github.submob
POM_ARTIFACT_ID=scopemob
POM_NAME=ScopeMob
POM_DESCRIPTION=Set of useful scope and higher-order functions
POM_INCEPTION_YEAR=2020
POM_URL=https://github.com/SubMob/ScopeMob
POM_LICENSE_NAME=The Apache Software License, Version 2.0
POM_LICENSE_URL=http://www.apache.org/licenses/LICENSE-2.0.txt
POM_LICENSE_DIST=repo
POM_DEVELOPER_ID=mustafaozhan
POM_DEVELOPER_NAME=Mustafa Ozhan
POM_DEVELOPER_EMAIL=mr.mustafa.ozhan@gmail.com
POM_SCM_URL=https://github.com/SubMob/ScopeMob
POM_SCM_CONNECTION=scm:git:git://github.com/SubMob/ScopeMob.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/SubMob/ScopeMob.git
# Publish to the new Central Portal and auto-release (no manual "release" step)
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true